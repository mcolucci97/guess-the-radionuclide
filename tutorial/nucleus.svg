  <g><circle cx="390" cy="220" r="28" class="p"/><text x="382" y="230" class="small">p</text><circle cx="455" cy="215" r="28" class="n"/><text x="446" y="225" class="small">n</text><circle cx="510" cy="260" r="28" class="p"/><text x="502" y="270" class="small">p</text><circle cx="425" cy="300" r="28" class="n"/><text x="416" y="310" class="small">n</text><circle cx="480" cy="325" r="28" class="n"/><text x="471" y="335" class="small">n</text></g>
  <text x="95" y="455" class="tiny">I protoni decidono l’elemento; i neutroni distinguono gli isotopi.</text>

