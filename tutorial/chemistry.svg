<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <style>text{font-family:Arial, Helvetica, sans-serif;fill:#0f172a} .small{font-size:24px;font-weight:700} .tiny{font-size:18px;font-weight:600;fill:#334155} .label{font-size:28px;font-weight:900} .card{fill:#fff;stroke:#cbd5e1;stroke-width:3;rx:28;filter:url(#shadow)} .p{fill:#f97316} .n{fill:#38bdf8} .e{fill:#a78bfa} .alpha{fill:#fde006} .beta{fill:#63b5c1} .orange{fill:#ff744f} .gamma{fill:#ffd0c5}</style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="32"/>

  <text x="95" y="75" class="label">Chimica dell’elemento</text>
  <rect x="120" y="120" width="160" height="160" fill="#dcfce7" stroke="#16a34a" stroke-width="5" rx="22"/><text x="165" y="200" class="label">Cl</text><text x="145" y="250" class="tiny">alogeno</text>
  <rect x="370" y="120" width="160" height="160" fill="#e0f2fe" stroke="#0284c7" stroke-width="5" rx="22"/><text x="415" y="200" class="label">Xe</text><text x="382" y="250" class="tiny">gas nobile</text>
  <rect x="620" y="120" width="160" height="160" fill="#ede9fe" stroke="#7c3aed" stroke-width="5" rx="22"/><text x="665" y="200" class="label">U</text><text x="640" y="250" class="tiny">attinide</text>
  <text x="105" y="420" class="tiny">La chimica è dell’elemento; il decadimento è del radionuclide.</text>

</svg>