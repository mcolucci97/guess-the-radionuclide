<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#fffdf8"/>
    <stop offset="1" stop-color="#eef7fb"/>
  </linearGradient>
  <linearGradient id="card" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8fbfd"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#17324d" flood-opacity="0.14"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <style>
    text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#102a43}
    .big{font-size:42px;font-weight:850}
    .mid{font-size:29px;font-weight:800}
    .label{font-size:23px;font-weight:750}
    .small{font-size:18px;font-weight:700}
    .tiny{font-size:15px;font-weight:650}
    .muted{fill:#52697d}
    .panel{fill:url(#card);stroke:#d5e2ea;stroke-width:2.5;filter:url(#shadow)}
    .thin{stroke:#6b879c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrow{stroke:#e58a18;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="900" height="520" rx="28" fill="url(#bg)"/>
<circle cx="808" cy="60" r="80" fill="#e58a18" opacity="0.06"/>
<circle cx="82" cy="470" r="110" fill="#3aa17e" opacity="0.055"/>
<text x="450" y="70" text-anchor="middle" class="mid">element chemistry</text><rect x="70" y="150" width="110" height="70" rx="18" fill="#dceeff" stroke="#fff" stroke-width="3"/><text x="125.0" y="198" text-anchor="middle" class="mid">F</text><rect x="200" y="150" width="110" height="70" rx="18" fill="#e0f4e7" stroke="#fff" stroke-width="3"/><text x="255.0" y="198" text-anchor="middle" class="mid">Xe</text><rect x="330" y="150" width="110" height="70" rx="18" fill="#ffe7d7" stroke="#fff" stroke-width="3"/><text x="385.0" y="198" text-anchor="middle" class="mid">Cs</text><rect x="460" y="150" width="110" height="70" rx="18" fill="#eee3ff" stroke="#fff" stroke-width="3"/><text x="515.0" y="198" text-anchor="middle" class="mid">I</text><rect x="590" y="150" width="110" height="70" rx="18" fill="#ffe2e4" stroke="#fff" stroke-width="3"/><text x="645.0" y="198" text-anchor="middle" class="mid">Ra</text><rect x="720" y="150" width="110" height="70" rx="18" fill="#fff0d2" stroke="#fff" stroke-width="3"/><text x="775.0" y="198" text-anchor="middle" class="mid">U</text><circle cx="180" cy="330" r="45" fill="#627d98" opacity="0.16"/><text x="180" y="341" text-anchor="middle" class="mid">●</text><circle cx="355" cy="330" r="45" fill="#3b82f6" opacity="0.16"/><text x="355" y="341" text-anchor="middle" class="mid">≈</text><circle cx="530" cy="330" r="45" fill="#7b61d1" opacity="0.16"/><text x="530" y="341" text-anchor="middle" class="mid">↑</text><circle cx="705" cy="330" r="45" fill="#e58a18" opacity="0.16"/><text x="705" y="341" text-anchor="middle" class="mid">Tₘ</text><text x="450" y="435" text-anchor="middle" class="small muted">supporting property — not nuclear decay</text>
</svg>