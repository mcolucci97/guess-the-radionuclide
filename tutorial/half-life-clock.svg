<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <style>text{font-family:Arial, Helvetica, sans-serif;fill:#0f172a} .small{font-size:24px;font-weight:700} .tiny{font-size:18px;font-weight:600;fill:#334155} .label{font-size:28px;font-weight:900} .card{fill:#fff;stroke:#cbd5e1;stroke-width:3;rx:28;filter:url(#shadow)} .p{fill:#f97316} .n{fill:#38bdf8} .e{fill:#a78bfa} .alpha{fill:#fde006} .beta{fill:#63b5c1} .orange{fill:#ff744f} .gamma{fill:#ffd0c5}</style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="32"/>

  <text x="95" y="80" class="label">Scale temporali</text>
  <line x1="110" y1="260" x2="790" y2="260" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <g class="small" text-anchor="middle"><text x="140" y="215">s</text><text x="255" y="215">min</text><text x="370" y="215">ore</text><text x="485" y="215">giorni</text><text x="600" y="215">mesi</text><text x="720" y="215">anni</text></g>
  <g fill="#f97316"><circle cx="140" cy="260" r="16"/><circle cx="255" cy="260" r="16"/><circle cx="370" cy="260" r="16"/><circle cx="485" cy="260" r="16"/><circle cx="600" cy="260" r="16"/><circle cx="720" cy="260" r="16"/></g>
  <text x="105" y="400" class="tiny">“Dell’ordine delle ore” significa che la scala naturale della durata è qualche ora, non giorni o anni.</text>

</svg>