<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#fffdf8"/>
    <stop offset="1" stop-color="#eef7fb"/>
  </linearGradient>
  <linearGradient id="card" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8fbfd"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#17324d" flood-opacity="0.14"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <style>
    text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#102a43}
    .big{font-size:42px;font-weight:850}
    .mid{font-size:29px;font-weight:800}
    .label{font-size:23px;font-weight:750}
    .small{font-size:18px;font-weight:700}
    .tiny{font-size:15px;font-weight:650}
    .muted{fill:#52697d}
    .panel{fill:url(#card);stroke:#d5e2ea;stroke-width:2.5;filter:url(#shadow)}
    .thin{stroke:#6b879c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrow{stroke:#3b82f6;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="900" height="520" rx="28" fill="url(#bg)"/>
<circle cx="808" cy="60" r="80" fill="#3b82f6" opacity="0.06"/>
<circle cx="82" cy="470" r="110" fill="#3aa17e" opacity="0.055"/>
<line x1="90" y1="285" x2="810" y2="285" stroke="#6b879c" stroke-width="5"/><line x1="110" y1="265" x2="110" y2="305" stroke="#6b879c" stroke-width="4"/><text x="110" y="340" text-anchor="middle" class="label">s</text><line x1="220" y1="265" x2="220" y2="305" stroke="#6b879c" stroke-width="4"/><text x="220" y="340" text-anchor="middle" class="label">min</text><line x1="340" y1="265" x2="340" y2="305" stroke="#6b879c" stroke-width="4"/><text x="340" y="340" text-anchor="middle" class="label">h</text><line x1="460" y1="265" x2="460" y2="305" stroke="#6b879c" stroke-width="4"/><text x="460" y="340" text-anchor="middle" class="label">d</text><line x1="610" y1="265" x2="610" y2="305" stroke="#6b879c" stroke-width="4"/><text x="610" y="340" text-anchor="middle" class="label">y</text><line x1="790" y1="265" x2="790" y2="305" stroke="#6b879c" stroke-width="4"/><text x="790" y="340" text-anchor="middle" class="label">Gy</text><circle cx="120" cy="185" r="42" fill="#4c9bd4" opacity="0.18"/><circle cx="120" cy="185" r="28" fill="#4c9bd4"/><circle cx="360" cy="185" r="42" fill="#2f9d73" opacity="0.18"/><circle cx="360" cy="185" r="28" fill="#2f9d73"/><circle cx="610" cy="185" r="42" fill="#e5a41a" opacity="0.18"/><circle cx="610" cy="185" r="28" fill="#e5a41a"/><circle cx="780" cy="185" r="42" fill="#7b61d1" opacity="0.18"/><circle cx="780" cy="185" r="28" fill="#7b61d1"/><text x="450" y="92" text-anchor="middle" class="big">T½</text><text x="450" y="455" text-anchor="middle" class="small muted">orders of magnitude</text>
</svg>