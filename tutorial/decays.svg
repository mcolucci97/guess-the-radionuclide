<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a} .title{font-size:34px;font-weight:900} .label{font-size:26px;font-weight:800} .small{font-size:20px;font-weight:700;fill:#334155} .tiny{font-size:16px;font-weight:600;fill:#475569} .box{fill:#fff;stroke:#cbd5e1;stroke-width:3;rx:24} .p{fill:#fb923c} .n{fill:#38bdf8} .alpha{fill:#fde047} .beta{fill:#67e8f9} .orange{fill:#fb7185} .gamma{fill:#fed7aa} .green{fill:#bbf7d0} .purple{fill:#ddd6fe} .blue{fill:#bfdbfe} .dark{fill:#0f172a}</style></defs>
<rect width="900" height="520" fill="#fffdf8"/>
<text x="40" y="55" class="title">Alfa, beta, gamma: tre indizi diversi</text>
<rect class="box" x="45" y="105" width="250" height="310"/><circle class="alpha" cx="95" cy="180" r="35"/><text class="label" x="145" y="188">α alfa</text><text class="small" x="75" y="255">pesante</text><text class="small" x="75" y="290">si ferma presto</text><rect x="85" y="330" width="150" height="20" fill="#e2e8f0"/><text x="75" y="385" class="tiny">foglio / pelle</text>
<rect class="box" x="325" y="105" width="250" height="310"/><circle class="beta" cx="375" cy="180" r="28"/><text class="label" x="425" y="188">β beta</text><text class="small" x="355" y="255">elettrone</text><text class="small" x="355" y="290">penetrazione media</text><rect x="365" y="330" width="160" height="20" fill="#94a3b8"/><text x="350" y="385" class="tiny">alluminio sottile</text>
<rect class="box" x="605" y="105" width="250" height="310"/><circle class="gamma" cx="655" cy="180" r="28"/><text class="label" x="705" y="188">γ gamma</text><text class="small" x="635" y="255">onda / energia</text><text class="small" x="635" y="290">molto penetrante</text><rect x="645" y="330" width="160" height="20" fill="#475569"/><text x="635" y="385" class="tiny">piombo / cemento</text>
</svg>