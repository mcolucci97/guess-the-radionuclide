    .label{font-size:23px;font-weight:750}
    .small{font-size:18px;font-weight:700}
    .tiny{font-size:15px;font-weight:650}
    .muted{fill:#52697d}
    .panel{fill:url(#card);stroke:#d5e2ea;stroke-width:2.5;filter:url(#shadow)}
    .thin{stroke:#6b879c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrow{stroke:#7b61d1;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
