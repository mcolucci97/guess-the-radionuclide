<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#fffdf8"/>
    <stop offset="1" stop-color="#eef7fb"/>
  </linearGradient>
  <linearGradient id="card" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8fbfd"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#17324d" flood-opacity="0.14"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <style>
    text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#102a43}
    .big{font-size:42px;font-weight:850}
    .mid{font-size:29px;font-weight:800}
    .label{font-size:23px;font-weight:750}
    .small{font-size:18px;font-weight:700}
    .tiny{font-size:15px;font-weight:650}
    .muted{fill:#52697d}
    .panel{fill:url(#card);stroke:#d5e2ea;stroke-width:2.5;filter:url(#shadow)}
    .thin{stroke:#6b879c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrow{stroke:#7b61d1;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="900" height="520" rx="28" fill="url(#bg)"/>
<circle cx="808" cy="60" r="80" fill="#7b61d1" opacity="0.06"/>
<circle cx="82" cy="470" r="110" fill="#3aa17e" opacity="0.055"/>
<line x1="110" y1="430" x2="815" y2="430" stroke="#6b879c" stroke-width="3"/><line x1="110" y1="80" x2="110" y2="430" stroke="#6b879c" stroke-width="3"/><text x="73" y="100" class="small">σ(E)</text><text x="807" y="470" class="small">E</text><path d="M120 330 C170 180 210 360 265 250 S330 390 370 170 S420 360 470 240 S560 315 620 285 S720 310 800 300" stroke="#7b61d1" stroke-width="7" fill="none"/><text x="450" y="68" text-anchor="middle" class="mid">neutron-capture cross section</text><text x="205" y="405" text-anchor="middle" class="tiny">thermal</text><text x="410" y="405" text-anchor="middle" class="tiny">resonances</text><text x="700" y="405" text-anchor="middle" class="tiny">fast</text>
</svg>