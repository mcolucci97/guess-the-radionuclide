<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#fffdf8"/>
    <stop offset="1" stop-color="#eef7fb"/>
  </linearGradient>
  <linearGradient id="card" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8fbfd"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#17324d" flood-opacity="0.14"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <style>
    text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#102a43}
    .big{font-size:42px;font-weight:850}
    .mid{font-size:29px;font-weight:800}
    .label{font-size:23px;font-weight:750}
    .small{font-size:18px;font-weight:700}
    .tiny{font-size:15px;font-weight:650}
    .muted{fill:#52697d}
    .panel{fill:url(#card);stroke:#d5e2ea;stroke-width:2.5;filter:url(#shadow)}
    .thin{stroke:#6b879c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrow{stroke:#7b61d1;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="900" height="520" rx="28" fill="url(#bg)"/>
<circle cx="808" cy="60" r="80" fill="#7b61d1" opacity="0.06"/>
<circle cx="82" cy="470" r="110" fill="#3aa17e" opacity="0.055"/>
<text x="450" y="70" text-anchor="middle" class="mid">nuclear relationships</text><rect x="40" y="160" width="140" height="120" rx="22" fill="#dceeff" stroke="#ffffff" stroke-width="2.3" filter="url(#shadow)"/><text x="110" y="230" text-anchor="middle" class="label">parent</text><rect x="240" y="160" width="140" height="120" rx="22" fill="#e1f4e7" stroke="#ffffff" stroke-width="2.3" filter="url(#shadow)"/><text x="310" y="230" text-anchor="middle" class="label">daughter</text><rect x="440" y="160" width="140" height="120" rx="22" fill="#fff0d2" stroke="#ffffff" stroke-width="2.3" filter="url(#shadow)"/><text x="510" y="230" text-anchor="middle" class="label">generator</text><rect x="640" y="160" width="140" height="120" rx="22" fill="#ede4ff" stroke="#ffffff" stroke-width="2.3" filter="url(#shadow)"/><text x="710" y="230" text-anchor="middle" class="label">activation</text><path d="M180 220 L240 220 M240 220 L227.5 228.4 M240 220 L227.5 211.6" stroke="#3b82f6" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 220 L440 220 M440 220 L427.5 228.4 M440 220 L427.5 211.6" stroke="#2f9d73" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M580 220 L640 220 M640 220 L627.5 228.4 M640 220 L627.5 211.6" stroke="#7b61d1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="375" text-anchor="middle" class="small muted">chain ≠ fission product ≠ generator daughter ≠ activation product</text>
</svg>