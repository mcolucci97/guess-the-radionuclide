<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a} .title{font-size:34px;font-weight:900} .label{font-size:26px;font-weight:800} .small{font-size:20px;font-weight:700;fill:#334155} .tiny{font-size:16px;font-weight:600;fill:#475569} .box{fill:#fff;stroke:#cbd5e1;stroke-width:3;rx:24} .p{fill:#fb923c} .n{fill:#38bdf8} .alpha{fill:#fde047} .beta{fill:#67e8f9} .orange{fill:#fb7185} .gamma{fill:#fed7aa} .green{fill:#bbf7d0} .purple{fill:#ddd6fe} .blue{fill:#bfdbfe} .dark{fill:#0f172a}</style></defs>
<rect width="900" height="520" fill="#fffdf8"/>
<text x="40" y="55" class="title">Domande larghe: meglio per iniziare</text>
<g><rect class="box" x="60" y="105" width="170" height="130"/><text x="105" y="170" font-size="58">🏥</text><text class="small" x="93" y="215">medicina</text></g>
<g><rect class="box" x="260" y="105" width="170" height="130"/><text x="305" y="170" font-size="58">🌿</text><text class="small" x="300" y="215">natura</text></g>
<g><rect class="box" x="460" y="105" width="170" height="130"/><text x="505" y="170" font-size="58">🏠</text><text class="small" x="507" y="215">casa</text></g>
<g><rect class="box" x="660" y="105" width="170" height="130"/><text x="705" y="170" font-size="58">🚀</text><text class="small" x="700" y="215">spazio</text></g>
<text x="90" y="305" class="label">Prima chiedi categorie grandi</text><text x="90" y="350" class="small">Poi usa curiosità specifiche quando restano poche carte.</text><text x="90" y="405" class="tiny">Esempio: “è legato alla vita quotidiana?” prima di “è quello delle banane?”</text>
</svg>