  <g font-size="54" font-family="Arial"><text x="145" y="230">🍌</text><text x="275" y="230">🏠</text><text x="405" y="230">🏥</text><text x="535" y="230">☄️</text><text x="665" y="230">🚀</text></g>
  <text x="135" y="310" class="tiny">Ogni storia è un indizio: vita quotidiana, ambiente, medicina, spazio o industria.</text>

