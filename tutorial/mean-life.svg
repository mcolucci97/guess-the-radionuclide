<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a} .title{font-size:34px;font-weight:900} .label{font-size:26px;font-weight:800} .small{font-size:20px;font-weight:700;fill:#334155} .tiny{font-size:16px;font-weight:600;fill:#475569} .box{fill:#fff;stroke:#cbd5e1;stroke-width:3;rx:24} .p{fill:#fb923c} .n{fill:#38bdf8} .alpha{fill:#fde047} .beta{fill:#67e8f9} .orange{fill:#fb7185} .gamma{fill:#fed7aa} .green{fill:#bbf7d0} .purple{fill:#ddd6fe} .blue{fill:#bfdbfe} .dark{fill:#0f172a}</style></defs>
<rect width="900" height="520" fill="#fffdf8"/>
<text x="40" y="55" class="title">Emivita e vita media descrivono lo stesso decadimento</text><rect class="box" x="70" y="120" width="320" height="260"/><text class="label" x="115" y="185">T½</text><text class="small" x="115" y="230">tempo per dimezzare</text><text class="tiny" x="115" y="270">100 → 50 → 25</text><rect class="box" x="510" y="120" width="320" height="260"/><text class="label" x="555" y="185">τ</text><text class="small" x="555" y="230">vita media</text><text class="tiny" x="555" y="270">τ = T½ / ln2</text><path d="M395 250 L505 250" stroke="#0f172a" stroke-width="6"/><text class="small" x="365" y="430">Nel gioco entrambe contano come “domande sul tempo”.</text>
</svg>