<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#fffdf8"/>
    <stop offset="1" stop-color="#eef7fb"/>
  </linearGradient>
  <linearGradient id="card" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8fbfd"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#17324d" flood-opacity="0.14"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <style>
    text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#102a43}
    .big{font-size:42px;font-weight:850}
    .mid{font-size:29px;font-weight:800}
    .label{font-size:23px;font-weight:750}
    .small{font-size:18px;font-weight:700}
    .tiny{font-size:15px;font-weight:650}
    .muted{fill:#52697d}
    .panel{fill:url(#card);stroke:#d5e2ea;stroke-width:2.5;filter:url(#shadow)}
    .thin{stroke:#6b879c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrow{stroke:#3b82f6;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="900" height="520" rx="28" fill="url(#bg)"/>
<circle cx="808" cy="60" r="80" fill="#3b82f6" opacity="0.06"/>
<circle cx="82" cy="470" r="110" fill="#3aa17e" opacity="0.055"/>
<path d="M100 130 C210 190 310 265 430 330 C560 402 690 430 815 448" stroke="#3b82f6" stroke-width="7" fill="none"/><line x1="100" y1="100" x2="100" y2="455" stroke="#6b879c" stroke-width="3"/><line x1="100" y1="455" x2="830" y2="455" stroke="#6b879c" stroke-width="3"/><text x="67" y="120" class="small">N/N₀</text><text x="825" y="487" class="small">t</text><line x1="100" y1="290" x2="355" y2="290" stroke="#9eb5c5" stroke-dasharray="8 8" stroke-width="3"/><line x1="355" y1="290" x2="355" y2="455" stroke="#9eb5c5" stroke-dasharray="8 8" stroke-width="3"/><text x="355" y="485" text-anchor="middle" class="label">T½</text><rect x="520" y="80" width="300" height="190" rx="24" fill="#ffffff" stroke="#d5e2ea" stroke-width="2.3" filter="url(#shadow)"/><text x="670" y="128" text-anchor="middle" class="label">N(t)=N₀e^(−λt)</text><text x="670" y="176" text-anchor="middle" class="label">T½ = ln2 / λ</text><text x="670" y="224" text-anchor="middle" class="label">τ = 1 / λ</text><text x="450" y="70" text-anchor="middle" class="mid">exponential decay</text>
</svg>